name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run linter
        run: |
          ruff check .
          
      - name: Check formatting
        run: |
          ruff format --check .
          
      - name: Run type checker
        run: |
          mypy .
          
      # TODO: Add tests here when ready
      - name: Run tests
        run: |
          echo "Tests placeholder - add pytest command when tests are implemented"
